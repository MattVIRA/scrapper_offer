# Réglages du script. Modifie ce fichier, puis relance : python -m offers collect

# Sources d'offres. Mettre enabled: false pour en couper une.
sources:
  business_france:
    enabled: true
    # Recherches à surveiller.
    # Pour en ajouter une : fais ta recherche sur le site, copie l'adresse
    # de la page et colle-la dans "url". Le "name" est libre, il apparaît
    # dans la colonne "Recherche" du fichier Excel.
    # Pour couper une recherche sans l'effacer : enabled: false (aussi
    # depuis la page Collecte de l'interface).
    searches:
      - name: "Recherche principale"
        url: "https://mon-vie-via.businessfrance.fr/offres/recherche?query=&specializationsIds=243&specializationsIds=210&specializationsIds=212&specializationsIds=59&specializationsIds=255&specializationsIds=24&geographicZones=2&geographicZones=3&geographicZones=4&geographicZones=6&geographicZones=5&studiesLevelId=4&teletravail=0&porteEnv=0"

# Mots-clés cherchés dans le titre, la description et le profil.
# Majuscules et accents ne comptent pas. Le score d'une offre est le
# nombre de mots-clés trouvés.
keywords_include:
  - python
  - machine learning
  - data
  - ia
  - deep learning
  - sql

# Si un de ces mots est trouvé, le score de l'offre passe à 0.
# L'offre reste quand même dans le fichier.
keywords_exclude: []

# Lettres de motivation (page Lettres de l'interface).
# Chemins relatifs au dossier de ce fichier. Aucune donnée personnelle
# ici : le CV va dans le dossier du profil, hors git.
letters:
  # Contient cv/ (un ou plusieurs CV), exemples/ (anciennes lettres,
  # modèles de la lettre) et consignes.md (facultatif : ton, longueur,
  # points à mettre en avant).
  profile_dir: profil
  # Dossier où les lettres .docx sont écrites.
  output_dir: lettres
  # Prompt envoyé à Claude, modifiable depuis la page Lettres.
  prompt: prompts/lettre.md
  # Modèle de Claude (par exemple sonnet ou opus). Sans cette ligne :
  # celui de Claude Code par défaut.
  # model: sonnet
