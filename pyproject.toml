[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapper-offer"
version = "0.1.0"
description = "Récupère les offres VIE et les range dans un fichier Excel."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "streamlit>=1.66",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
offers = "offers.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"offers.storage" = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Le code actuel tient en 100 caractères (une ligne dépasse 88).
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
