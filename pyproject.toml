[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapper-offer"
version = "0.1.0"
description = "Récupère les offres VIE et les range dans un fichier Excel."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
# Le code passera dans src/ au lot 1.
packages = ["vie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Le code actuel tient en 100 caractères (une ligne dépasse 88).
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
